name: Build Godot Web Prototype

on:
  push:
    branches: [main]
    paths:
      - "prototype/p1-godot/**"
      - ".github/workflows/build-godot-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.1
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64

      - name: Install Web export templates
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz \
            -o /tmp/templates.tpz
          rm -rf /tmp/templates
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Import and validate project
        run: |
          timeout 120s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path prototype/p1-godot --quit

      - name: Export single-thread Web build
        run: |
          rm -rf prototype/p1-godot-web
          mkdir -p prototype/p1-godot-web
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --path prototype/p1-godot \
            --export-release Web ../p1-godot-web/index.html
          touch prototype/p1-godot-web/.nojekyll
          test -f prototype/p1-godot-web/index.html
          test -f prototype/p1-godot-web/index.wasm
          test -f prototype/p1-godot-web/index.pck

      - name: Commit generated Web build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f prototype/p1-godot-web
          if git diff --cached --quiet; then
            echo "Web build is unchanged."
            exit 0
          fi
          git commit -m "build: publish PocketPal Godot web prototype"
          git push
