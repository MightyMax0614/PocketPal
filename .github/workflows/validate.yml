name: Validate PocketPal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python research bridges
        run: |
          python -m py_compile tools/img2threejs_bridge.py
          python -m py_compile tools/character_job_v2_adapter.py

      - name: Validate active P1.5 Rive JavaScript
        run: node --check prototype/p1-rive/app.js

      - name: Validate active P1.5 entry
        run: |
          grep -q "PocketPal P1.5" prototype/p1-rive/index.html
          grep -q "@rive-app/webgl2@2.36.0" prototype/p1-rive/index.html
          grep -q "prototype/p1-rive/" index.html
          grep -q "skills.riv" prototype/p1-rive/app.js
          grep -q "vehicles.riv" prototype/p1-rive/app.js

      - name: Validate retained P1.4 research JavaScript
        run: |
          node --check prototype/p1-web/app.js
          node --check prototype/p1-web/touch-fix.js
          node --check prototype/p1-web/soul-character.js
          node --check prototype/p1-web/character-studio.js
          node --check prototype/p1-web/character-customizer.js
          node --check prototype/p1-web/character-3d.js
          node --check prototype/p1-web/job-manager.js
          cp prototype/p1-web/viewer-3d.js /tmp/viewer-3d.mjs
          node --check /tmp/viewer-3d.mjs

      - name: Validate JSON research examples
        run: |
          python -m json.tool prototype/assets/jobs/example-job.json > /dev/null
          python -m json.tool prototype/assets/jobs/example-character-job-v2.json > /dev/null
