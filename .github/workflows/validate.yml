name: Validate PocketPal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python bridges
        run: |
          python -m py_compile tools/img2threejs_bridge.py
          python -m py_compile tools/character_job_v2_adapter.py

      - name: Validate active P1.4 JavaScript
        run: |
          node --check prototype/p1-web/app.js
          node --check prototype/p1-web/touch-fix.js
          node --check prototype/p1-web/soul-character.js
          node --check prototype/p1-web/character-studio.js

      - name: Validate retained research JavaScript
        run: |
          node --check prototype/p1-web/character-customizer.js
          node --check prototype/p1-web/character-3d.js
          node --check prototype/p1-web/job-manager.js
          cp prototype/p1-web/viewer-3d.js /tmp/viewer-3d.mjs
          node --check /tmp/viewer-3d.mjs

      - name: Validate active P1.4 entry
        run: |
          grep -q "PocketPal P1.4" prototype/p1-web/index.html
          grep -q "soul-character.js" prototype/p1-web/index.html
          grep -q "character-studio.js" prototype/p1-web/index.html
          grep -q "base-body-v01.css" prototype/p1-web/index.html
          if grep -q "character-3d.js" prototype/p1-web/index.html; then
            echo "P1.4 must not load the 3D workflow in the main UI"
            exit 1
          fi

      - name: Validate JSON examples
        run: |
          python -m json.tool prototype/assets/jobs/example-job.json > /dev/null
          python -m json.tool prototype/assets/jobs/example-character-job-v2.json > /dev/null
