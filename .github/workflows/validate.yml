name: Validate PocketPal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python research bridges
        run: |
          python -m py_compile tools/img2threejs_bridge.py
          python -m py_compile tools/character_job_v2_adapter.py

      - name: Validate active P1.8 Godot project
        run: |
          grep -q "PocketPal P1.8" prototype/p1-godot/main.tscn
          grep -q "prototype/p1-godot-web/" index.html
          grep -q "GODOT_THREADS_ENABLED = false" prototype/p1-godot-web/index.html
          test -f prototype/p1-godot-web/index.wasm
          test -f prototype/p1-godot-web/index.pck
          grep -q "play_pet" prototype/p1-godot/scripts/character.gd
          grep -q "cycle_hat" prototype/p1-godot/scripts/character.gd
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for path in pathlib.Path('prototype/p1-godot/assets').glob('*.svg'):
              ET.parse(path)
          PY
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          timeout 90s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 \
            --headless --editor --path prototype/p1-godot --quit

      - name: Validate retained P1.7 Rive Character Studio
        run: |
          node --check prototype/p1-rive-character/app.js
          node --check prototype/p1-rive-character/pocketpal-contract.js
          grep -q "PocketPal P1.7" prototype/p1-rive-character/index.html
          grep -q "PocketPalState" prototype/p1-rive-character/pocketpal-contract.js
          grep -q "pocketpal.riv" prototype/p1-rive-character/app.js
          grep -q "basePreview" prototype/p1-rive-character/index.html
          grep -q "showBaseBody" prototype/p1-rive-character/app.js
          grep -q "Rive 엔진 샘플 보기" prototype/p1-rive-character/index.html
          python -m json.tool prototype/assets/rive/pocketpal-rig-contract.json > /dev/null
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('prototype/assets/rive/pocketpal-base-body.svg')
          PY

      - name: Validate retained P1.5.2 Rive recovery
        run: |
          node --check prototype/p1-rive/app.js
          grep -q "PocketPal P1.5.2" prototype/p1-rive/index.html
          grep -q "canvas-single" prototype/p1-rive/app.js
          grep -q "raw.githubusercontent.com/rive-app/rive-flutter" prototype/p1-rive/app.js
          grep -q "stepRuntime" prototype/p1-rive/index.html
          grep -q "stepRender" prototype/p1-rive/index.html
          grep -q "onLoad 후 첫 화면 표시 확인" prototype/p1-rive/app.js

      - name: Validate retained P1.6 Soul Lab
        run: |
          node --check prototype/p1-soul/app.js
          grep -q "PocketPal P1.6" prototype/p1-soul/index.html
          grep -q "pocketpal.soul.v1" prototype/p1-soul/app.js

      - name: Validate retained P1.4 research JavaScript
        run: |
          node --check prototype/p1-web/app.js
          node --check prototype/p1-web/touch-fix.js
          node --check prototype/p1-web/soul-character.js
          node --check prototype/p1-web/character-studio.js
          node --check prototype/p1-web/character-customizer.js
          node --check prototype/p1-web/character-3d.js
          node --check prototype/p1-web/job-manager.js
          cp prototype/p1-web/viewer-3d.js /tmp/viewer-3d.mjs
          node --check /tmp/viewer-3d.mjs

      - name: Validate JSON research examples
        run: |
          python -m json.tool prototype/assets/jobs/example-job.json > /dev/null
          python -m json.tool prototype/assets/jobs/example-character-job-v2.json > /dev/null
