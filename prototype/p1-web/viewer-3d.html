<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#e9f1f2" />
  <title>PocketPal 실제 3D Viewer</title>
  <link rel="stylesheet" href="viewer-3d.css?v=2" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-header">
      <button id="viewerBack" type="button">← 돌아가기</button>
      <div>
        <strong>실제 3D 캐릭터</strong>
        <small id="viewerSubtitle">저장된 GLB 결과</small>
      </div>
      <button id="viewerAutoRotate" type="button" aria-pressed="true">자동 회전</button>
    </header>

    <section id="viewerCanvas" class="viewer-canvas" aria-label="실제 GLB 캐릭터 3D 뷰어"></section>

    <section class="viewer-panel">
      <p id="viewerStatus">저장된 실제 3D 결과를 불러오는 중이에요…</p>
      <p class="viewer-warning">
        이 화면은 <b>GLB 또는 img2threejs의 실제 Three.js 결과</b>만 표시합니다.
        사진판·컷아웃·가짜 2.5D는 자동으로 만들지 않습니다.
      </p>
      <div class="viewer-actions">
        <label class="file-button" for="viewerModelFile">다른 GLB 열기</label>
        <input id="viewerModelFile" type="file" accept=".glb,model/gltf-binary" />
        <button id="viewerReload" type="button">저장 결과 다시 열기</button>
      </div>
      <p class="viewer-help">한 손가락: 회전 · 두 손가락: 확대/축소 · 위·아래에서도 확인 가능</p>
    </section>
  </main>

  <script type="module" src="viewer-3d.js?v=2"></script>
</body>
</html>
